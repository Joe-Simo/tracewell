# Tracewell: design-control traceability for Jira and Confluence.
# app.id was set by `forge register` (developer space: Joe Simo Apps).
app:
  id: ari:cloud:ecosystem::app/537ed219-00cd-47b6-9870-0dcbe1c6c5b2
  runtime:
    name: nodejs24.x
    architecture: arm64
    memoryMB: 256

modules:
  jira:issuePanel:
    - key: tracewell-issue-panel
      title: Tracewell trace
      icon: resource:assets;tracewell.svg
      resource: issue-panel
      render: native
      resolver:
        function: ui-resolver
  jira:projectPage:
    - key: tracewell-project-page
      title: Tracewell
      resource: project-page
      render: native
      resolver:
        function: ui-resolver

  jira:projectSettingsPage:
    - key: tracewell-settings
      title: Tracewell
      resource: settings-page
      render: native
      resolver:
        function: ui-resolver

  trigger:
    - key: tracewell-suspect-trigger
      function: suspect-fn
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

  rovo:agent:
    - key: tracewell-agent
      name: Tracewell
      description: Checks design-control traceability in Jira, explains change impact
        and tells you whether a release is ready.
      prompt: resource:agent-resource;prompt.txt
      conversationStarters:
        - What trace gaps block this project?
        - What must be re-tested if this requirement changes?
        - Is version 2.1.0 ready to release?
        - Are all hazards controlled and verified?
      actions:
        - get-trace-gaps
        - get-trace-chain
        - analyze-change-impact
        - get-release-readiness
        - get-risk-controls
        - publish-trace-report
      skills:
        - design-control-release-check

  rovo:skill:
    - key: design-control-release-check
      source:
        dir: skills/design-control-release-check
      dependencies:
        tools:
          - get-release-readiness
          - analyze-change-impact
          - get-risk-controls
          - publish-trace-report

  rovo:mcp:
    - key: tracewell-mcp
      name: Tracewell
      tools:
        - get-trace-gaps
        - get-trace-chain
        - analyze-change-impact
        - get-release-readiness
        - get-risk-controls

  action:
    - key: get-trace-gaps
      name: Get trace gaps
      function: gaps-fn
      actionVerb: GET
      description: List missing trace links, orphan items, failed, unrun and suspect
        tests in a Jira project.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example MED.
    - key: get-trace-chain
      name: Get trace chain
      function: chain-fn
      actionVerb: GET
      description: Show what a Jira issue traces to upstream and what traces to it
        downstream, with its gaps.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example MED-12.
    - key: analyze-change-impact
      name: Analyze change impact
      function: impact-fn
      actionVerb: GET
      description: List the tests to re-run, items to review and hazards involved if a
        Jira issue changes.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key that is changing.
    - key: get-release-readiness
      name: Get release readiness
      function: readiness-fn
      actionVerb: GET
      description: Decide whether a fix version is ready to release based on trace
        coverage and test status.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key.
        version:
          title: Fix version
          type: string
          required: true
          description: The Jira fix version name, for example 2.1.0.
    - key: get-risk-controls
      name: Get risk controls
      function: risk-fn
      actionVerb: GET
      description: List hazards with their risk controls, the verification tests for
        each control, and whether each hazard is controlled, partial or open.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key.
        version:
          title: Fix version
          type: string
          required: false
          description: Optional fix version name to limit the list to one release.
    - key: publish-trace-report
      name: Publish trace report
      function: report-fn
      actionVerb: CREATE
      description: Create or update a Confluence page with the release trace matrix,
        risk controls, coverage and blockers. Each publish adds a page version.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key.
        version:
          title: Fix version
          type: string
          required: true
          description: The Jira fix version name.
        spaceKey:
          title: Confluence space key
          type: string
          required: false
          description: The key of the Confluence space for the report page, for example QMS.
        spaceId:
          title: Confluence space id
          type: string
          required: false
          description: The numeric Confluence space id. Use instead of spaceKey if known.

  function:
    - key: ui-resolver
      handler: index.uiResolver
    - key: gaps-fn
      handler: index.getTraceGaps
    - key: chain-fn
      handler: index.getTraceChain
    - key: impact-fn
      handler: index.analyzeChangeImpact
    - key: readiness-fn
      handler: index.getReleaseReadiness
    - key: risk-fn
      handler: index.getRiskControls
    - key: report-fn
      handler: index.publishTraceReport
    - key: suspect-fn
      handler: index.issueUpdated

resources:
  - key: issue-panel
    path: src/frontend/issue-panel.tsx
  - key: project-page
    path: src/frontend/project-page.tsx
  - key: settings-page
    path: src/frontend/settings-page.tsx
  - key: agent-resource
    path: resources/agent
  - key: assets
    path: resources/assets

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
